<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">

  <!-- Botón Volver arriba a la izquierda -->
  <a href="index.html" class="btn-volver">← Volver</a>

  <!-- Contenedor central -->
  <main class="auth-container">
    <form id="auth-form" class="auth-card">
      <h1 class="auth-title">Iniciar Sesión</h1>

      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div id="error-message" class="error-message"></div>

      <button type="submit" id="btn-submit" class="btn-submit">Ingresar</button>
    </form>
  </main>

<style>
    .main-footer { /* Fondo oscuro / negro */
        color: #ffffff;
        text-align: center;
        padding: 20px 16px;
        margin-top: 40px;
        font-size: 0.9rem;
    }

    .main-footer p {
        margin: 0;
        color: #00040a;
    }

    .main-footer strong {
        color: #ffffff;
    }
</style>

<footer class="main-footer">
    <p>&copy; <span id="copyrightYear"></span> <strong>SAFO</strong>. Todos los derechos reservados.</p>
</footer>

<script>
    // Inserción dinámica del año actual
    document.addEventListener('DOMContentLoaded', () => {
        const yearSpan = document.getElementById('copyrightYear');
        if (yearSpan) {
            yearSpan.textContent = new Date().getFullYear();
        }
    });
</script>

  <script src="script/config.js"></script>
  <script src="script/auth.js"></script>
</body>
</html>
