<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso / Registro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="brand-capsule">&larr; Volver</a>
    </header>

    <div class="card-auth">
        <h2 id="auth-title" style="margin-bottom: 20px;">Iniciar Sesión</h2>
        
        <form id="auth-form">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="correo@ejemplo.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-primary" id="btn-submit">Ingresar</button>
        </form>

        <p style="margin-top: 16px; font-size: 0.9rem; text-align: center;">
            <a href="#" id="toggle-auth" style="color: #4a6fa5;">¿No tienes cuenta? Regístrate</a>
        </p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
