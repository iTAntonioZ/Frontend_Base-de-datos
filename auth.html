<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="brand-capsule">&larr; Volver</a>
    </header>

    <div class="card-auth">
        <h2 id="auth-title" style="margin-bottom: 20px;">Iniciar Sesión</h2>
        
        <form id="auth-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" required placeholder="admin">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-primary" id="btn-submit">Ingresar</button>

            <!-- Mensaje de error debajo del botón -->
            <p id="error-message" style="color: #e63946; font-size: 0.9rem; margin-top: 14px; text-align: center; display: none; font-weight: 500;"></p>
        </form>
    </div>

    <script src="script/config.js"></script>
    <script src="script/auth.js"></script>
</body>
</html>
